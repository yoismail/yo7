name: Regenerate static pages

# index.html is the single source of truth for every page's content, but
# GitHub Pages serves the *generated* copies (about/, product/<slug>/,
# etc.) directly as real crawlable URLs — see README.md and the two
# scripts in scripts/. Those copies have to be regenerated by hand
# whenever index.html changes, which is exactly the kind of step that's
# easy to forget mid-ship. This workflow removes that step entirely: any
# push to main that touches index.html re-runs both generators and, if
# their output differs from what's committed, pushes the fix straight
# back to main so the live site can't stay stale for more than a minute
# or two.
#
# The `paths: [index.html]` trigger below is also what stops this from
# looping forever — the commit this workflow makes only touches the
# generated directories and sitemap.xml, never index.html itself, so it
# doesn't match the trigger and this workflow doesn't re-run on its own
# commit.

on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: regenerate-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate the 9 static content pages
        run: python3 scripts/generate-static-pages.py

      - name: Regenerate the 76 static product pages + sitemap.xml
        run: python3 scripts/generate-product-pages.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet; then
            echo "Generated pages already up to date, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about/ contact/ cookie-policy/ delivery-info/ delivery-policy/ guide/ privacy/ returns/ terms/ product/ sitemap.xml
          git commit -m "Regenerate static pages for latest index.html [skip ci]"
          git push origin HEAD:main
