name: Regenerate static pages

# src/index.html is the single source of truth for every page's content
# (a human-edited file, never minified), but the live site serves
# *generated, minified* copies — repo-root index.html itself plus about/,
# product/<slug>/, etc. — as real crawlable URLs and as the actual bytes
# Cloudflare ships to visitors (this project has no build step of its
# own — see wrangler.jsonc — so whatever's committed at these paths is
# exactly what's live). Those copies have to be regenerated whenever
# either of two things changes, which is exactly the kind of step that's
# easy to forget/not even know to do mid-ship:
#
#   1. src/index.html itself (a real code change) — the `push` trigger
#      below.
#   2. The live product catalogue in Supabase (an admin adding a product,
#      or editing/deleting one through the panel) — nothing about that
#      touches this repo at all, so nothing would ever re-run this
#      workflow on its own. The `schedule` trigger below is what catches
#      this: scripts/generate-product-pages.py now fetches
#      custom_products/product_overrides itself on every run (see that
#      script's own docstring) and regenerates every product page from
#      the same live data the site itself shows, not just the ~249
#      hardcoded ones — so an hourly run is what keeps a crawler's view
#      of price/stock/title (and which products exist at all) from
#      drifting more than an hour behind what a real visitor sees.
#
# Either way, this re-runs both generators, then minifies every page
# (scripts/minify.py), and if the result differs from what's committed,
# pushes the fix straight back to main.
#
# The `paths: [src/index.html]` push trigger is also what stops *that*
# path from looping forever — the commit this workflow makes only
# touches repo-root index.html, the generated directories, and
# sitemap.xml, never src/index.html itself, so it doesn't match the push
# trigger and this workflow doesn't re-run on its own commit. The
# schedule trigger has no such loop to worry about — a scheduled run
# that finds nothing changed just exits without committing (see the last
# step below), so it's a no-op the vast majority of hours.

on:
  push:
    branches: [main]
    paths: [src/index.html]
  schedule:
    # Anchored at :17, not :00, so this doesn't pile onto the same minute
    # as everyone else's hourly cron across all of GitHub Actions.
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: regenerate-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate the 9 static content pages
        run: python3 scripts/generate-static-pages.py

      - name: Regenerate static product pages (live catalogue) + sitemap.xml
        run: python3 scripts/generate-product-pages.py

      - name: Minify repo-root index.html and every generated page
        run: python3 scripts/minify.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet; then
            echo "Generated pages already up to date, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about/ contact/ cookie-policy/ delivery-info/ delivery-policy/ guide/ privacy/ returns/ terms/ product/ sitemap.xml
          git commit -m "Regenerate + minify static pages for the latest src/index.html and catalogue [skip ci]"
          git push origin HEAD:main
