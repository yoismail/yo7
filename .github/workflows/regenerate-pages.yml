name: Regenerate static pages

# src/index.html is the single source of truth for every page's content
# (a human-edited file, never minified), but the live site serves
# *generated, minified* copies — repo-root index.html itself plus about/,
# product/<slug>/, etc. — as real crawlable URLs and as the actual bytes
# Cloudflare ships to visitors (this project has no build step of its
# own — see wrangler.jsonc — so whatever's committed at these paths is
# exactly what's live). Those copies have to be regenerated by hand
# whenever src/index.html changes, which is exactly the kind of step
# that's easy to forget mid-ship. This workflow removes that step
# entirely: any push to main that touches src/index.html re-runs both
# generators, then minifies every page (scripts/minify.py), and if the
# result differs from what's committed, pushes the fix straight back to
# main so the live site can't stay stale for more than a minute or two.
#
# The `paths: [src/index.html]` trigger below is also what stops this
# from looping forever — the commit this workflow makes only touches
# repo-root index.html, the generated directories, and sitemap.xml,
# never src/index.html itself, so it doesn't match the trigger and this
# workflow doesn't re-run on its own commit.

on:
  push:
    branches: [main]
    paths: [src/index.html]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: regenerate-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate the 9 static content pages
        run: python3 scripts/generate-static-pages.py

      - name: Regenerate the 249 static product pages + sitemap.xml
        run: python3 scripts/generate-product-pages.py

      - name: Minify repo-root index.html and every generated page
        run: python3 scripts/minify.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet; then
            echo "Generated pages already up to date, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about/ contact/ cookie-policy/ delivery-info/ delivery-policy/ guide/ privacy/ returns/ terms/ product/ sitemap.xml
          git commit -m "Regenerate + minify static pages for latest src/index.html [skip ci]"
          git push origin HEAD:main
