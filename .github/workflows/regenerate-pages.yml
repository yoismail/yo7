name: Regenerate static pages

# src/index.html is the single source of truth for every page's content
# (a human-edited file, never minified), but the live site serves
# *generated, minified* copies — repo-root index.html itself plus about/,
# product/<slug>/, etc. — as real crawlable URLs and as the actual bytes
# Cloudflare ships to visitors (this project has no build step of its
# own — see wrangler.jsonc — so whatever's committed at these paths is
# exactly what's live). Those copies have to be regenerated whenever
# either of two things changes, which is exactly the kind of step that's
# easy to forget/not even know to do mid-ship:
#
#   1. src/index.html itself (a real code change) — the `push` trigger
#      below.
#   2. The live product catalogue in Supabase (an admin adding a product,
#      or editing/deleting one through the panel) — nothing about that
#      touches this repo at all, so nothing would ever re-run this
#      workflow on its own. The `schedule` trigger below is what catches
#      this: scripts/generate-product-pages.py now fetches
#      custom_products/product_overrides itself on every run (see that
#      script's own docstring) and regenerates every product page from
#      the same live data the site itself shows, not just the ~249
#      hardcoded ones — so an hourly run is what keeps a crawler's view
#      of price/stock/title (and which products exist at all) from
#      drifting more than an hour behind what a real visitor sees.
#
# Either way, this re-runs both generators, then minifies every page
# (scripts/minify.py), and if the result differs from what's committed,
# pushes the fix straight back to main.
#
# generate-product-pages.py also keeps a PRODUCT_SLUGS map inside
# src/index.html itself in sync with the live catalogue (see that
# script's own update_product_slugs_in_source()), so this workflow's own
# commit CAN touch src/index.html, not just the generated output - what
# actually stops that from looping this workflow back into itself is the
# `if:` guard on the job below, which skips a run only when BOTH the
# trigger was a push (not schedule/workflow_dispatch) AND the pusher was
# this same workflow's own prior commit (github-actions[bot], the
# identity `git push origin HEAD:main` below authenticates as via the
# default GITHUB_TOKEN). The `paths: [src/index.html]` filter on the push
# trigger above only stops this workflow firing on pushes that don't
# touch that file at all - it can't by itself prevent the self-loop,
# since this workflow's own commit sometimes DOES touch src/index.html.
#
# This used to rely on a literal "[skip ci]" tag in the commit message
# below instead of this actor check - GitHub Actions honours that tag
# regardless of which paths a commit touches, which is exactly why it
# worked for the self-loop problem. The actual bug: Cloudflare's own Git
# integration ALSO treats "[skip ci]" as "don't deploy this commit" -
# every commit this workflow ever pushed was silently never deployed,
# while the generated files sitting in the repo looked completely
# correct. The job-level actor check below solves the original
# self-loop problem without that side effect, so a real commit message
# is all that's left and Cloudflare deploys normally again.
on:
  push:
    branches: [main]
    paths: [src/index.html]
  schedule:
    # Anchored at :17, not :00, so this doesn't pile onto the same minute
    # as everyone else's hourly cron across all of GitHub Actions.
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: regenerate-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate the static content pages
        run: python3 scripts/generate-static-pages.py

      - name: Regenerate static product pages (live catalogue) + sitemap.xml
        run: python3 scripts/generate-product-pages.py

      - name: Minify repo-root index.html and every generated page
        run: python3 scripts/minify.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet; then
            echo "Generated pages already up to date, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html index.html about/ careers/ contact/ cookie-policy/ delivery-info/ delivery-policy/ guide/ privacy/ returns/ terms/ work-with-us/ product/ sitemap.xml
          git commit -m "Regenerate + minify static pages for the latest src/index.html and catalogue"
          git push origin HEAD:main
