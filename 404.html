<head>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --aubergine: #063B00;
            --aubergine-deep: #042500;
            --chartreuse: #90B800;
            --chartreuse-rich: #729400;
            --cream: #FAF9F2;
            --page-bg: var(--cream);
            --card-bg: #FFFFFF;
            --heading: var(--aubergine);
            --text-body: #4a3d3a;
            --text-muted: #6b5f58;
        }

        /* Same detection as index.html's own theme-flash-prevention script
           (see the <script> in <head> there) — defaults to light regardless
           of OS preference, dark only if explicitly chosen via the toggle
           on a previous visit, so this page matches whatever the site
           itself is currently showing instead of guessing independently. */
        [data-theme="dark"] {
            --page-bg: #0E1A08;
            --card-bg: #17240E;
            --heading: #F3F1E6;
            --text-body: #E3DDD2;
            --text-muted: #B0A89D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat Alternates', sans-serif;
            background: var(--page-bg);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 48px 36px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(6, 59, 0, 0.12);
        }

        .seal {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            display: block;
        }

        .code {
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--chartreuse-rich);
            margin-bottom: 10px;
        }

        h1 {
            font-weight: 700;
            font-size: 26px;
            color: var(--heading);
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            line-height: 1.55;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: inline-block;
            padding: 13px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14.5px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary {
            background: var(--chartreuse);
            color: var(--aubergine-deep);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(144, 184, 0, 0.28);
        }

        .btn-secondary {
            background: transparent;
            color: var(--heading);
            border: 1.5px solid rgba(6, 59, 0, 0.18);
        }

        [data-theme="dark"] .btn-secondary {
            border-color: rgba(250, 249, 242, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(144, 184, 0, 0.1);
        }
    </style>
    <script>
        (function () {
            try {
                if (localStorage.getItem('yo7-theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) { /* private browsing etc. */ }
        })();
    </script>
</head>

        <p>We couldn't find the page you were looking for. It may have moved, or the link might just be broken — but

</html>
